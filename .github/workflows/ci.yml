name: Backend checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Strict type checks
        run: python -m mypy app
      - name: Prepare dedicated PostgreSQL 16 database without Docker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          sudo pg_createcluster 16 jobhunter_ci --port 55432 --start
          pg_isready --host 127.0.0.1 --port 55432
          sudo -u postgres psql -p 55432 -v ON_ERROR_STOP=1 -c "CREATE ROLE jobhunter_ci LOGIN PASSWORD 'ephemeral-ci-only';"
          sudo -u postgres createdb -p 55432 -O jobhunter_ci jobhunter_ci_test
      - name: Unit, architecture and real PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://jobhunter_ci:ephemeral-ci-only@127.0.0.1:55432/jobhunter_ci_test
        run: python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontEnd/jobhunter/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontEnd/jobhunter
        run: npm ci
      - name: Check frontend types and production build
        working-directory: frontEnd/jobhunter
        env:
          JOBHUNTER_TEMPLATE_OPTIONAL: "1"
        run: |
          npm run typecheck
          npm run build
      - name: Angular component and session tests
        working-directory: frontEnd/jobhunter
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm test
      - name: Browser flow against FastAPI and PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://jobhunter_ci:ephemeral-ci-only@127.0.0.1:55432/jobhunter_ci_test
        run: python scripts/frontend_e2e.py
      - name: Audit frontend runtime dependencies
        working-directory: frontEnd/jobhunter
        run: npm audit --omit=dev

  windows-native:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      JOBHUNTER_TEST_ENV: .env.test.local
      JOBHUNTER_TEMPLATE_OPTIONAL: "1"
    defaults:
      run:
        working-directory: backend
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Prepare isolated PostgreSQL from runner binaries
        run: |
          $env:PG_BIN = $env:PGBIN
          if (-not (Test-Path -LiteralPath (Join-Path $env:PG_BIN 'initdb.exe'))) {
            throw 'PostgreSQL binaries unavailable on runner'
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PG_BIN=$env:PG_BIN"
          python scripts/local_postgres.py start
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os; from dotenv import dotenv_values; value=dotenv_values('.env.test.local')['DATABASE_URL']; print('::add-mask::'+value); open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8').write('TEST_DATABASE_URL='+value+'\n')"
      - name: Prepare real Windows AppContainer parser
        run: python scripts/setup_cv_sandbox.py
      - name: Native Windows and PostgreSQL tests
        run: python -m pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontEnd/jobhunter/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontEnd/jobhunter
        run: npm ci
      - name: Check frontend types and production build
        working-directory: frontEnd/jobhunter
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Complete browser flow including native CV parsing
        run: python scripts/frontend_e2e.py
      - name: Stop isolated PostgreSQL fixture
        if: always()
        run: python scripts/local_postgres.py stop

# Local-only project: Docker builds and hosting are out of scope by owner request.
