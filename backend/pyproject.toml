[project]
name = "jobhunter-backend"
version = "0.1.0"
description = "JobHunter AI modular API and worker"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "PyJWT>=2.10,<3",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy>=1.15,<2",
  "pip-audit>=2.7,<3",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/modules"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["integration: requires a dedicated real PostgreSQL database"]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]
